[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "recforge"
version = "0.1.0"
description = "Research-grade temporal evaluation and modeling for modern recommendation systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ziyang Xu" }]
dependencies = [
  "numpy>=1.26,<2.5",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]
pretrained = [
  "safetensors==0.8.0",
  "transformers==5.17.0",
]

[project.scripts]
recforge-mind-audit = "recforge.data.mind:main"
recforge-mind-features = "recforge.data.features:main"
recforge-mind-protocol-audit = "recforge.data.protocol_audit:main"
recforge-mind-submission = "recforge.data.submission:main"
recforge-mind-vocab = "recforge.data.text:main"
recforge-l1 = "recforge.l1_experiment:main"
recforge-l2 = "recforge.l2_experiment:main"
recforge-l2-slices = "recforge.slices:main"
recforge-paired-bootstrap = "recforge.statistics:main"
recforge-l1-aggregate = "recforge.reporting:main"
recforge-logged-popularity = "recforge.logged_baselines:main"
recforge-pretrained-features = "recforge.data.pretrained:main"
recforge-r1 = "recforge.experiment:main"
recforge-smoke = "recforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recforge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
